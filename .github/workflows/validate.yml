name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Valider les skills
        run: python tools/validate_skills.py
      - name: Tests des calculateurs
        run: |
          for d in countries/*/*/tests; do
            echo "== $d"
            python -m unittest discover -s "$d"
          done
