<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">paperwork-skills</title>
  <desc id="d">Skills pour agents IA : paperasse fiscale et administrative, pays par pays. Chaque valeur a une source et un niveau de confiance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#14223f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="1120" cy="60" r="220" fill="#2dd4bf" fill-opacity="0.07"/>
    <circle cx="1240" cy="380" r="180" fill="#60a5fa" fill-opacity="0.07"/>
    <rect x="0" y="0" width="8" height="400" fill="url(#accent)"/>
  </g>

  <!-- pile de feuilles (motif original) -->
  <g transform="translate(920 78)">
    <rect x="34" y="26" width="200" height="236" rx="14" fill="#1b2c4f" stroke="#2f4573" stroke-width="2" transform="rotate(7 134 144)"/>
    <rect x="14" y="12" width="200" height="236" rx="14" fill="#203560" stroke="#3a5287" stroke-width="2" transform="rotate(3 114 130)"/>
    <rect x="0" y="0" width="200" height="236" rx="14" fill="#f4f7fb"/>
    <rect x="22" y="26" width="92" height="12" rx="6" fill="#0a1020"/>
    <rect x="22" y="54" width="156" height="8" rx="4" fill="#c5d0e2"/>
    <rect x="22" y="72" width="132" height="8" rx="4" fill="#c5d0e2"/>
    <rect x="22" y="90" width="148" height="8" rx="4" fill="#c5d0e2"/>
    <line x1="22" y1="116" x2="178" y2="116" stroke="#dbe3f0" stroke-width="2"/>
    <circle cx="34" cy="142" r="7" fill="#34d399"/><rect x="50" y="138" width="80" height="8" rx="4" fill="#0a1020" fill-opacity="0.75"/>
    <circle cx="34" cy="168" r="7" fill="#fbbf24"/><rect x="50" y="164" width="104" height="8" rx="4" fill="#0a1020" fill-opacity="0.75"/>
    <circle cx="34" cy="194" r="7" fill="#94a3b8"/><rect x="50" y="190" width="66" height="8" rx="4" fill="#0a1020" fill-opacity="0.75"/>
    <rect x="22" y="212" width="60" height="10" rx="5" fill="url(#accent)"/>
  </g>

  <!-- textes -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="150" font-size="68" font-weight="800" fill="#e8eef9" letter-spacing="-1.5">paperwork<tspan fill="url(#accent)">-skills</tspan></text>
    <text x="66" y="198" font-size="25" fill="#9fb0c9">Skills pour agents IA : la paperasse fiscale, pays par pays.</text>
    <text x="66" y="230" font-size="19" fill="#6f83a6">AI agent skills for tax &amp; admin paperwork. Every value is sourced.</text>

    <!-- puces pays -->
    <g transform="translate(64 272)">
      <rect width="168" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="84" y="27" font-size="17" font-weight="700" fill="#e8eef9" text-anchor="middle">ca-qc · Québec</text>
      <rect x="184" width="132" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="250" y="27" font-size="17" font-weight="700" fill="#e8eef9" text-anchor="middle">ma · Maroc</text>
      <rect x="332" width="168" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-opacity="0.6" stroke-dasharray="5 5"/>
      <text x="416" y="27" font-size="17" font-weight="600" fill="#2dd4bf" text-anchor="middle">+ votre pays</text>
    </g>

    <!-- légende de confiance -->
    <g transform="translate(64 346)" font-size="15" fill="#9fb0c9">
      <circle cx="7" cy="-5" r="6" fill="#34d399"/><text x="22" y="0">officiel</text>
      <circle cx="107" cy="-5" r="6" fill="#fbbf24"/><text x="122" y="0">secondaire</text>
      <circle cx="232" cy="-5" r="6" fill="#94a3b8"/><text x="247" y="0">non confirmé</text>
    </g>
  </g>
</svg>
